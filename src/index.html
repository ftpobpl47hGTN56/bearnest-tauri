<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BearNest VPN Tauri+Rust v2.10.0</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ══ КАСТОМНЫЙ ТИТЛБАР (drag-region + иконки min/close) ══ -->
  <header class="titlebar" data-tauri-drag-region>
    <div class="tb-left" data-tauri-drag-region>
      <span class="tb-logo">🐻</span>
      <span class="tb-title" data-tauri-drag-region>BearNest VPN Tauri+Rust v2.10.0</span>
      <span id="statusPill" class="status-pill off" data-tip-i18n="TipCheckConn" style="cursor:pointer">
        <span class="dot"></span><span id="statusText">Отключено</span>
      </span>
    </div>
    <div class="tb-right">
      <span id="timerText" class="tb-timer"></span>
      <button id="btnMin" class="tb-btn" title="Свернуть">
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button id="btnClose" class="tb-btn tb-close" title="Закрыть">
        <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
  </header>

  <main class="app">
    <!-- ══ ПАНЕЛЬ ПОДПИСКИ ══ -->
    <section id="subPanel" class="card sub-card" hidden>
      <div class="sub-row">
        <span id="subTitle" class="sub-title">AID VPN</span>
        <span id="subTraffic" class="sub-traffic">↑↓ —</span>
      </div>
      <div id="subExpire" class="sub-expire">—</div>
    </section>

    <!-- ══ URL + LOAD ══ -->
    <section class="url-row">
      <div class="input-wrap">
        <svg class="in-ico" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        <input id="subUrl" type="text" spellcheck="false" placeholder="https://…/sub" />
      </div>
      <button id="btnLoad" class="btn btn-accent" data-tip-i18n="TipLoad">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span data-i18n="BtnLoad">Загрузить</span>
      </button>
    </section>

    <!-- ══ КНОПКИ ДЕЙСТВИЙ (иконки) ══ -->
    <section class="actions">
      <button id="btnConnect" class="btn btn-connect" data-tip-i18n="TipConnect">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span data-i18n="BtnConnect">Подключить</span>
      </button>
      <button id="btnSwitch" class="btn btn-switch" data-tip-i18n="TipSwitch" disabled>
        <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span data-i18n="BtnSwitch">Сменить</span>
      </button>
      <button id="btnDisconnect" class="btn btn-stop" data-tip-i18n="TipDisconnect" disabled>
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        <span data-i18n="BtnDisconnect">Отключить</span>
      </button>
      <button id="btnPing" class="btn btn-ping" data-tip-i18n="TipPing">
        <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span data-i18n="BtnPing">Пинг</span>
      </button>
      <label class="tun-toggle" data-tip-i18n="TipTun">
        <input id="chkTun" type="checkbox" />
        <span>TUN</span>
        <span id="tunStatus" class="tun-status"></span>
      </label>
    </section>

    <div id="selectedServer" class="selected"></div>

    <!-- ══ ВКЛАДКИ ══ -->
    <nav class="tabs">
      <button class="tab active" data-tab="servers"><span data-i18n="TabServers">Серверы</span></button>
      <button class="tab" data-tab="log"><span data-i18n="TabLog">Лог</span></button>
      <button class="tab" data-tab="bypass"><span data-i18n="TabBypass">Bypass</span></button>
      <button class="tab" data-tab="settings"><span data-i18n="TabSettings">Настройки</span></button>
    </nav>

    <!-- Серверы -->
    <section class="panel active" data-panel="servers">
      <div class="server-toolbar">
        <select id="sortSelect" class="mini-select">
          <option value="default" data-i18n="SortDefault">По умолчанию</option>
          <option value="name" data-i18n="SortName">Имя</option>
          <option value="proto" data-i18n="SortProto">Протокол</option>
          <option value="ping" data-i18n="SortPing">Пинг</option>
        </select>
        <button id="sortDirBtn" class="btn btn-ghost btn-sm" data-tip-i18n="TipSortDir">▲</button>
      </div>
      <div class="server-head">
        <span class="col" data-sort="name"><span data-i18n="ColServer">Сервер</span><i class="ar"></i></span>
        <span class="col" data-sort="proto"><span data-i18n="ColProtocol">Протокол</span><i class="ar"></i></span>
        <span class="col" data-sort="ping"><span data-i18n="ColPing">Пинг</span><i class="ar"></i></span>
      </div>
      <ul id="serverList" class="server-list"></ul>
    </section>

    <!-- Лог -->
    <section class="panel" data-panel="log">
      <div class="log-toolbar">
        <select id="logFilter" class="mini-select">
          <option value="all" data-i18n="FilterAll">Всё</option>
          <option value="bearnest">BearNest</option>
          <option value="error">Ошибки</option>
        </select>
        <button id="btnPauseLog" class="btn btn-ghost btn-sm">
          <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <span data-i18n="BtnPause">Пауза</span>
        </button>
        <button id="btnClearLog" class="btn btn-ghost btn-sm">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span data-i18n="BtnClear">Очистить</span>
        </button>
      </div>
      <div id="logBox" class="log-box"></div>
    </section>

    <!-- Bypass -->
    <section class="panel" data-panel="bypass">
      <div class="quick-add">
        <input id="quickDomain" type="text" spellcheck="false" placeholder="google.com" />
        <button id="btnAddDomain" class="btn btn-sm btn-accent"><span data-i18n="BtnAdd">Добавить</span></button>
      </div>
      <label class="chk-line">
        <input id="chkBypassLan" type="checkbox" checked />
        <span data-i18n="BypassLan">Локальную сеть — напрямую</span>
      </label>
      <div class="field">
        <label data-i18n="BypassDomains">Домены напрямую (по одному на строку)</label>
        <textarea id="bypassDomains" spellcheck="false" rows="5"></textarea>
      </div>
      <div class="field">
        <label data-i18n="BypassIPs">IP / CIDR напрямую</label>
        <textarea id="bypassIPs" spellcheck="false" rows="3"></textarea>
      </div>
      <div class="bypass-actions">
        <button id="btnSaveBypass" class="btn btn-accent"><span data-i18n="BtnSaveRules">Сохранить правила</span></button>
        <span id="splitStatus" class="split-status"></span>
      </div>
    </section>

    <!-- Настройки -->
    <section class="panel" data-panel="settings">
      <div class="setting-row">
        <label data-i18n="Theme">Тема</label>
        <div class="row-controls">
          <select id="themeSelect" class="mini-select">
            <option value="dark">🌙 Dark</option>
            <option value="light">☀️ Light</option>
            <option value="nord">🏔️ Nord</option>
            <option value="bear">🐻 Bear</option>
          </select>
          <button id="btnThemeEdit" class="btn btn-ghost btn-sm">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <span data-i18n="ThemeEdit">Редактор</span>
          </button>
          <button id="btnImportTheme" class="btn btn-ghost btn-sm icon-btn" data-tip-i18n="TipImportTheme">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button id="btnExportTheme" class="btn btn-ghost btn-sm icon-btn" data-tip-i18n="TipExportTheme">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </button>
          <button id="btnDelTheme" class="btn btn-ghost btn-sm icon-btn danger" data-tip-i18n="TipDelTheme" hidden>
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      <div class="setting-row">
        <label data-i18n="Language">Язык</label>
        <select id="langSelect" class="mini-select">
          <option value="ru">🇷🇺 RU</option>
          <option value="en">🇬🇧 EN</option>
        </select>
      </div>
      <div class="setting-row">
        <label data-i18n="AutoConnect">Автоподключение при старте</label>
        <input id="chkAutoConnect" type="checkbox" />
      </div>
      <div class="setting-row">
        <label data-i18n="AutoSwitchFail">Автопереключение при сбое</label>
        <input id="chkAutoSwitchFail" type="checkbox" />
      </div>
      <div class="setting-row">
        <label data-i18n="BackupSettings">Настройки клиента</label>
        <div class="row-controls">
          <button id="btnImportSettings" class="btn btn-ghost btn-sm" data-tip-i18n="TipImportSettings">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span data-i18n="BtnImport">Импорт</span>
          </button>
          <button id="btnExportSettings" class="btn btn-ghost btn-sm" data-tip-i18n="TipExportSettings">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span data-i18n="BtnExport">Экспорт</span>
          </button>
        </div>
      </div>
    <div class="setting-row">
    <label data-i18n="LogsLabel">Логи</label>
    <button id="btnOpenLogs" class="btn btn-ghost btn-sm" data-tip-i18n="TipOpenLogs">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span data-i18n="BtnOpenLogs">Открыть папку логов</span>
    </button>
  </div>
      <div class="about" id="about">BearNest • Rust + Tauri</div>
    </section>
  </main>


  <!-- ══ ТОСТ ══ -->
  <div id="toast" class="toast">
    <span id="toastIcon">✅</span><span id="toastText"></span>
  </div>

  <script src="themes.js"></script>
  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
