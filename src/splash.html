<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BearNest VPN Tauri+Rust v2.10.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #12141c; }

    /* Фон-лес на всё окно */
    .splash {
      position: relative; width: 100vw; height: 100vh;
      background: url("assets/splash-forest.jpg") center/cover no-repeat;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      /* лёгкое затемнение снизу для читаемости названия */
    }
    .splash::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,12,20,.15) 0%, rgba(10,12,20,.45) 100%);
    }

    /* Контент поверх затемнения */
    .content {
      position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center;
      /* плавное появление + исчезновение за 2.5s */
      animation: splashFade 2500ms ease-in-out forwards;
    }
    .bear {
      width: 145px; height: 145px; border-radius: 23px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
      animation: bearPop 700ms cubic-bezier(.2,.8,.2,1) both;
    }
    .title {
      margin-top: 16px; color: rgb(254, 249, 215);  font-size: 28px; font-weight: 700; letter-spacing: .5px;
      text-shadow: 0 2px 12px rgba(0,0,0,.55);
    }
    .subtitle {
      margin-top: 4px; color: rgb(254, 249, 215); font-size: 16px; font-weight: 500;
      text-shadow: 0 1px 8px rgba(0,0,0,.5);
    }

    /* Прогресс-полоска снизу (заполняется за 2.5s) */
    .bar { position: absolute; z-index: 2; bottom: 0; left: 0; height: 4px; width: 0;
      background: rgb(254, 254, 214); animation: barGrow 1500ms linear forwards; }

    @keyframes splashFade {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes bearPop {
      0% { transform: scale(.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes barGrow { from { width: 0; } to { width: 100%; } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="content">
      <img class="bear" src="assets/splash-bear.png" alt="BearNest" />
      <div class="title">BearNest</div>
      <div class="subtitle">VPN • Rust + Tauri</div>
    </div>
    <div class="bar"></div>
  </div>
</body>
</html>
